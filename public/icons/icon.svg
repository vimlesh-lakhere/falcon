<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Royal Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="85%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Luxury Gold Gradient for Falcon Wings -->
    <linearGradient id="goldWings" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="60%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Chrome / Platinum Accent for Falcon Head -->
    <linearGradient id="goldHead" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Glowing Rim Border Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="falconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle (Adaptive Android & iOS Compatible) -->
  <rect width="512" height="512" rx="116" fill="url(#bgGlow)" />
  
  <!-- Outer Metallic Border -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="url(#rimGrad)" stroke-width="8" stroke-opacity="0.85" />
  <rect x="18" y="18" width="476" height="476" rx="98" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.15" />

  <!-- Ambient Light Halo behind Falcon -->
  <circle cx="256" cy="220" r="140" fill="#6366f1" fill-opacity="0.25" filter="blur(30px)" />
  <circle cx="256" cy="210" r="90" fill="#f59e0b" fill-opacity="0.2" filter="blur(20px)" />

  <!-- THE FALCON / EAGLE IN FLIGHT ICON -->
  <g filter="url(#falconGlow)">
    <!-- LEFT WING FEATHERS -->
    <path d="M 256 220 
             C 210 160, 140 100, 64 120 
             C 80 155, 110 185, 145 205 
             C 105 200, 75 220, 85 245 
             C 115 255, 150 260, 185 260 
             C 145 270, 115 295, 130 315 
             C 165 320, 205 305, 235 285 
             C 210 310, 185 340, 205 355 
             C 230 355, 250 325, 256 295 Z" 
          fill="url(#goldWings)" stroke="#78350f" stroke-width="2" />

    <!-- RIGHT WING FEATHERS -->
    <path d="M 256 220 
             C 302 160, 372 100, 448 120 
             C 432 155, 402 185, 367 205 
             C 407 200, 437 220, 427 245 
             C 397 255, 362 260, 327 260 
             C 367 270, 397 295, 382 315 
             C 347 320, 307 305, 277 285 
             C 302 310, 327 340, 307 355 
             C 282 355, 262 325, 256 295 Z" 
          fill="url(#goldWings)" stroke="#78350f" stroke-width="2" />

    <!-- FALCON CHEST & BODY SHIELD -->
    <path d="M 256 165 
             L 285 220 
             L 278 330 
             L 256 370 
             L 234 330 
             L 227 220 Z" 
          fill="url(#goldWings)" stroke="#fef08a" stroke-width="3" />

    <!-- FALCON HEAD & SHARP BEAK -->
    <path d="M 256 95 
             C 272 95, 286 110, 288 130 
             C 298 135, 312 145, 308 165 
             C 298 168, 285 160, 280 155 
             L 275 190 
             L 237 190 
             L 232 155 
             C 227 160, 214 168, 204 165 
             C 200 145, 214 135, 224 130 
             C 226 110, 240 95, 256 95 Z" 
          fill="url(#goldHead)" stroke="#ffffff" stroke-width="3" />

    <!-- EAGLE EYE -->
    <circle cx="270" cy="132" r="6" fill="#0f172a" stroke="#ffffff" stroke-width="2" />
    <circle cx="272" cy="130" r="2" fill="#ffffff" />

    <!-- LIGHTNING CROWN ACCENT -->
    <polygon points="256,60 264,88 256,84 248,88" fill="#fef08a" stroke="#d97706" stroke-width="2" />
  </g>

  <!-- LOWER BRANDING BANNER: FALCON POS -->
  <g transform="translate(0, 395)">
    <!-- Sleek Rounded Ribbon -->
    <rect x="96" y="0" width="320" height="62" rx="20" fill="#0f172a" fill-opacity="0.9" stroke="url(#goldWings)" stroke-width="3" />
    
    <!-- Text -->
    <text x="256" y="38" font-family="'Inter', -apple-system, sans-serif" font-size="26" font-weight="900" text-anchor="middle" fill="#ffffff" letter-spacing="4">
      FALCON <tspan fill="#fbbf24">POS</tspan>
    </text>

    <!-- Star Highlights -->
    <circle cx="120" cy="30" r="4" fill="#fbbf24" />
    <circle cx="392" cy="30" r="4" fill="#fbbf24" />
  </g>
</svg>