<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="falcon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>
  
  <!-- Background Rounded Shield / Tile -->
  <rect width="512" height="512" rx="128" fill="url(#falcon-grad)" />
  
  <!-- Inner Glass Card -->
  <rect x="64" y="64" width="384" height="384" rx="80" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="4" />
  
  <!-- POS Shopping Terminal Icon / Falcon Wings -->
  <g transform="translate(116, 120)" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Shopping Bag Body -->
    <path d="M40 80 L240 80 L220 250 L60 250 Z" fill="#ffffff" fill-opacity="0.2" />
    <path d="M40 80 L240 80 L220 250 L60 250 Z" />
    
    <!-- Bag Handles -->
    <path d="M90 80 C90 20, 190 20, 190 80" />
    
    <!-- Lightning Bolt / Fast Billing Accent -->
    <polygon points="150,110 110,170 145,170 130,230 180,160 145,160" fill="#fbbf24" stroke="#d97706" stroke-width="8" />
  </g>
  
  <!-- Small Star Badge -->
  <circle cx="390" cy="120" r="32" fill="#fbbf24" stroke="#ffffff" stroke-width="6" />
  <text x="390" y="128" font-family="sans-serif" font-size="24" font-weight="900" text-anchor="middle" fill="#78350f">⚡</text>
</svg>
